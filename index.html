<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restoran Padang - Pemesanan Online</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', Tahoma, sans-serif;
    }

    body {
        background: linear-gradient(135deg, #fdf6ec 0%, #f5e6d3 100%);
        min-height: 100vh;
        padding: 20px;
        color: #333;
    }

    .container {
        max-width: 900px;
        margin: 0 auto;
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 10px 40px rgba(139, 69, 19, 0.15);
        overflow: hidden;
    }

    header {
        background: linear-gradient(135deg, #8b4513, #d2691e);
        color: #fff;
        padding: 24px;
        text-align: center;
    }

    header h1 { font-size: 1.6rem; margin-bottom: 4px; }
    header p { font-size: 0.9rem; opacity: 0.9; }

    #identitas-section { padding: 30px; }
    #identitas-section h2 { color: #8b4513; margin-bottom: 16px; font-size: 1.2rem; }

    .form-group { margin-bottom: 14px; }

    .form-group label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
        font-size: 0.9rem;
        color: #5a3a1a;
    }

    .form-group input,
    .form-group select {
        width: 100%;
        padding: 10px 14px;
        border: 2px solid #e0d0c0;
        border-radius: 8px;
        font-size: 1rem;
        transition: border-color 0.2s;
    }

    .form-group input:focus,
    .form-group select:focus {
        outline: none;
        border-color: #d2691e;
    }

    .btn {
        background: #d2691e;
        color: #fff;
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s, transform 0.1s;
    }

    .btn:hover { background: #b3551a; }
    .btn:active { transform: scale(0.98); }
    .btn-block { width: 100%; }

    .btn-secondary { background: #6c757d; }
    .btn-secondary:hover { background: #5a6268; }

    .btn-danger { background: #dc3545; }
    .btn-danger:hover { background: #b02a37; }

    .btn-success { background: #28a745; }
    .btn-success:hover { background: #1e7e34; }

    .btn-small { padding: 6px 12px; font-size: 0.85rem; }

    #app-section { display: none; }

    .user-info {
        background: #fff8f0;
        padding: 16px 24px;
        border-bottom: 1px solid #f0e0d0;
        font-size: 0.95rem;
        color: #5a3a1a;
    }

    .user-info strong { color: #8b4513; }

    .main-menu {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 10px;
        padding: 20px;
        background: #faf5ef;
        border-bottom: 1px solid #f0e0d0;
    }

    .main-menu button {
        background: #fff;
        border: 2px solid #e0d0c0;
        color: #5a3a1a;
        padding: 12px;
        border-radius: 10px;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        text-align: left;
    }

    .main-menu button:hover {
        background: #d2691e;
        color: #fff;
        border-color: #d2691e;
    }

    .main-menu button.keluar {
        border-color: #dc3545;
        color: #dc3545;
    }

    .main-menu button.keluar:hover {
        background: #dc3545;
        color: #fff;
    }

    .content { padding: 24px; }

    .content h2 {
        color: #8b4513;
        margin-bottom: 16px;
        font-size: 1.3rem;
        border-bottom: 2px solid #f0e0d0;
        padding-bottom: 8px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 16px;
        font-size: 0.9rem;
    }

    thead { background: #8b4513; color: #fff; }

    th, td {
        padding: 10px 12px;
        text-align: left;
        border-bottom: 1px solid #f0e0d0;
    }

    th.num, td.num { text-align: right; }
    th.center, td.center { text-align: center; }

    tbody tr:hover { background: #fdf6ec; }

    .total-row {
        font-weight: 700;
        font-size: 1rem;
        color: #8b4513;
        background: #fff8f0;
    }

    .empty-msg {
        text-align: center;
        padding: 40px 20px;
        color: #999;
        font-style: italic;
    }

    .qty-input {
        width: 70px;
        padding: 6px 8px;
        border: 2px solid #e0d0c0;
        border-radius: 6px;
        text-align: center;
        font-size: 0.9rem;
    }

    .qty-input:focus { outline: none; border-color: #d2691e; }

    #notif {
        position: fixed;
        top: 20px;
        right: 20px;
        padding: 14px 20px;
        border-radius: 10px;
        color: #fff;
        font-weight: 600;
        box-shadow: 0 6px 20px rgba(0,0,0,0.2);
        transform: translateX(400px);
        transition: transform 0.3s ease;
        z-index: 1000;
        max-width: 350px;
    }

    #notif.show { transform: translateX(0); }
    #notif.success { background: #28a745; }
    #notif.error { background: #dc3545; }
    #notif.info { background: #17a2b8; }

    .diskon-box {
        background: #fff3cd;
        border-left: 4px solid #ffc107;
        padding: 12px 16px;
        border-radius: 8px;
        margin: 12px 0;
        color: #856404;
        font-size: 0.9rem;
    }

    .struk {
        background: #f8f9fa;
        border: 2px dashed #d2691e;
        border-radius: 12px;
        padding: 20px;
        margin-top: 16px;
        font-family: 'Courier New', monospace;
    }

    .struk h3 {
        text-align: center;
        color: #8b4513;
        margin-bottom: 12px;
        font-size: 1.1rem;
    }

    .struk-line {
        display: flex;
        justify-content: space-between;
        padding: 4px 0;
        font-size: 0.9rem;
    }

    .struk-line.bold {
        font-weight: 700;
        border-top: 1px dashed #999;
        margin-top: 8px;
        padding-top: 8px;
    }

    .struk-line.highlight {
        color: #8b4513;
        font-size: 1rem;
    }

    .riwayat-card {
        background: #faf5ef;
        border-left: 4px solid #d2691e;
        border-radius: 8px;
        padding: 16px 20px;
        margin-bottom: 16px;
    }

    .riwayat-card h3 {
        color: #8b4513;
        font-size: 1rem;
        margin-bottom: 8px;
    }

    .riwayat-card .detail {
        font-size: 0.88rem;
        color: #666;
        line-height: 1.6;
    }

    .riwayat-card .detail strong { color: #5a3a1a; }

    /* ====== METODE PEMBAYARAN ====== */
    .metode-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin: 16px 0;
    }

    .metode-card {
        border: 2px solid #e0d0c0;
        border-radius: 12px;
        padding: 16px;
        text-align: center;
        cursor: pointer;
        transition: all 0.2s;
        background: #fff;
    }

    .metode-card:hover {
        border-color: #d2691e;
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(210, 105, 30, 0.15);
    }

    .metode-card.active {
        border-color: #d2691e;
        background: #fff8f0;
        box-shadow: 0 4px 12px rgba(210, 105, 30, 0.25);
    }

    .metode-card .icon {
        font-size: 2.2rem;
        margin-bottom: 6px;
        display: block;
    }

    .metode-card .label {
        font-weight: 700;
        color: #5a3a1a;
        font-size: 0.95rem;
    }

    .metode-card .sub {
        font-size: 0.78rem;
        color: #999;
        margin-top: 2px;
    }

    /* QRIS */
    .qris-box {
        background: #fff;
        border: 2px solid #e0d0c0;
        border-radius: 12px;
        padding: 20px;
        text-align: center;
        margin: 16px 0;
    }

    .qris-box .qris-label {
        font-weight: 700;
        color: #8b4513;
        font-size: 1.1rem;
        margin-bottom: 4px;
    }

    .qris-box .qris-sub {
        font-size: 0.82rem;
        color: #666;
        margin-bottom: 16px;
    }

    .qr-frame {
        display: inline-block;
        padding: 16px;
        background: #fff;
        border: 3px solid #8b4513;
        border-radius: 12px;
        margin-bottom: 12px;
    }

    .qr-frame canvas {
        display: block;
    }

    .qris-amount {
        font-size: 1.4rem;
        font-weight: 800;
        color: #8b4513;
        margin: 8px 0;
    }

    .qris-note {
        font-size: 0.8rem;
        color: #999;
        font-style: italic;
    }

    .pembayaran-section {
        margin-top: 16px;
        padding-top: 16px;
        border-top: 1px dashed #e0d0c0;
    }

    @media (max-width: 600px) {
        body { padding: 10px; }
        header h1 { font-size: 1.2rem; }
        .main-menu { grid-template-columns: 1fr 1fr; }
        table { font-size: 0.82rem; }
        th, td { padding: 8px 6px; }
        .metode-grid { grid-template-columns: 1fr; }
    }

    .hidden { display: none; }
</style>
</head>
<body>

<div class="container">
    <header>
        <h1>🍛 Restoran Padang</h1>
        <p>Sistem Pemesanan Online</p>
    </header>

    <!-- Identitas Pelanggan -->
    <section id="identitas-section">
        <h2>Form Identitas Pelanggan</h2>
        <div class="form-group">
            <label for="input-nama">Nama Pelanggan</label>
            <input type="text" id="input-nama" placeholder="Masukkan nama Anda">
        </div>
        <div class="form-group">
            <label for="input-meja">Nomor Meja</label>
            <input type="text" id="input-meja" placeholder="Contoh: 5">
        </div>
        <button class="btn btn-block" onclick="mulaiAplikasi()">Mulai Pemesanan →</button>
    </section>

    <!-- Aplikasi Utama -->
    <section id="app-section">
        <div class="user-info">
            👤 <strong id="info-nama">-</strong> &nbsp;|&nbsp; 🪑 Meja <strong id="info-meja">-</strong>
        </div>

        <nav class="main-menu">
            <button onclick="tampilkanMenu()">1. Tampilkan Menu</button>
            <button onclick="tampilkanTambahPesanan()">2. Tambah Pesanan</button>
            <button onclick="tampilkanKeranjang()">3. Lihat Keranjang</button>
            <button onclick="tampilkanUbahJumlah()">4. Ubah Jumlah Pesanan</button>
            <button onclick="tampilkanHapusItem()">5. Hapus Menu dari Keranjang</button>
            <button onclick="tampilkanCheckout()">6. Checkout & Bayar</button>
            <button onclick="tampilkanRiwayat()">7. Lihat Riwayat Pesanan</button>
            <button class="keluar" onclick="keluar()">0. Keluar</button>
        </nav>

        <div class="content" id="konten"></div>
    </section>
</div>

<div id="notif"></div>

<script>
/* =====================================================
   DATA GLOBAL
   ===================================================== */
const menu = {
    1:  { nama: "Nasi Rendang Nampol",    harga: 25000 },
    2:  { nama: "Nasi Ayam Pop",          harga: 22000 },
    3:  { nama: "Nasi Patin Sambel",      harga: 20000 },
    4:  { nama: "Nasi Dendeng Balado",    harga: 28000 },
    5:  { nama: "Nasi Bakar Ayam",        harga: 23000 },
    6:  { nama: "Perkedel",               harga: 5000  },
    7:  { nama: "Sayur Daun Singkong",    harga: 8000  },
    8:  { nama: "Es Teh Manis",           harga: 6000  },
    9:  { nama: "Teh Talua",              harga: 12000 },
    10: { nama: "Es Jeruk Hangat",        harga: 8000  },
};

let keranjang = [];
let riwayatPesanan = [];
let namaPelanggan = "";
let nomorMeja = "";

/* State checkout */
let metodePembayaran = null;   // "qris" atau "tunai"
let totalCheckout = 0;

/* =====================================================
   UTILITAS
   ===================================================== */
function rupiah(angka) {
    return "Rp " + angka.toLocaleString("id-ID");
}

function notif(pesan, tipe = "info") {
    const el = document.getElementById("notif");
    el.textContent = pesan;
    el.className = tipe + " show";
    clearTimeout(el._timer);
    el._timer = setTimeout(() => el.classList.remove("show"), 2500);
}

function escHtml(str) {
    return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
}

/* =====================================================
   GENERATOR QR CODE SEDERHANA (pola acak deterministic)
   ===================================================== */
function gambarQRCode(canvas, seedText) {
    const ctx = canvas.getContext("2d");
    const size = canvas.width;
    const cells = 25;              // 25x25 modul
    const cellSize = size / cells;

    // background
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, size, size);

    // seed sederhana dari string
    let seed = 0;
    for (let i = 0; i < seedText.length; i++) {
        seed = (seed * 31 + seedText.charCodeAt(i)) >>> 0;
    }
    function rnd() {
        seed = (seed * 1664525 + 1013904223) >>> 0;
        return seed / 4294967296;
    }

    // isi pola acak
    ctx.fillStyle = "#000000";
    for (let y = 0; y < cells; y++) {
        for (let x = 0; x < cells; x++) {
            // area finder pattern (3 kotak sudut) -> skip, gambar manual
            const inFinder =
                (x < 7 && y < 7) ||
                (x >= cells - 7 && y < 7) ||
                (x < 7 && y >= cells - 7);
            if (inFinder) continue;

            if (rnd() > 0.5) {
                ctx.fillRect(x * cellSize, y * cellSize, cellSize, cellSize);
            }
        }
    }

    // gambar finder pattern (kotak sudut khas QR)
    function drawFinder(px, py) {
        // hitam luar
        ctx.fillStyle = "#000000";
        ctx.fillRect(px, py, 7 * cellSize, 7 * cellSize);
        // putih tengah
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(px + cellSize, py + cellSize, 5 * cellSize, 5 * cellSize);
        // hitam dalam
        ctx.fillStyle = "#000000";
        ctx.fillRect(px + 2 * cellSize, py + 2 * cellSize, 3 * cellSize, 3 * cellSize);
    }
    drawFinder(0, 0);
    drawFinder((cells - 7) * cellSize, 0);
    drawFinder(0, (cells - 7) * cellSize);
}

/* =====================================================
   MULAI APLIKASI
   ===================================================== */
function mulaiAplikasi() {
    const nama = document.getElementById("input-nama").value.trim();
    const meja = document.getElementById("input-meja").value.trim();

    if (!nama) { notif("Nama pelanggan tidak boleh kosong!", "error"); return; }
    if (!meja) { notif("Nomor meja tidak boleh kosong!", "error"); return; }

    namaPelanggan = nama;
    nomorMeja = meja;

    document.getElementById("info-nama").textContent = namaPelanggan;
    document.getElementById("info-meja").textContent = nomorMeja;

    document.getElementById("identitas-section").style.display = "none";
    document.getElementById("app-section").style.display = "block";

    tampilkanMenu();
    notif(`Selamat datang, ${namaPelanggan}!`, "success");
}

/* =====================================================
   1. TAMPILKAN MENU
   ===================================================== */
function tampilkanMenu() {
    let html = `<h2>📋 Daftar Menu</h2>
    <table>
        <thead>
            <tr>
                <th class="center">No</th>
                <th>Nama Menu</th>
                <th class="num">Harga</th>
            </tr>
        </thead>
        <tbody>`;
    for (const [id, item] of Object.entries(menu)) {
        html += `<tr>
            <td class="center">${id}</td>
            <td>${escHtml(item.nama)}</td>
            <td class="num">${rupiah(item.harga)}</td>
        </tr>`;
    }
    html += `</tbody></table>`;
    document.getElementById("konten").innerHTML = html;
}

/* =====================================================
   2. TAMBAH PESANAN
   ===================================================== */
function tampilkanTambahPesanan() {
    let opsi = "";
    for (const [id, item] of Object.entries(menu)) {
        opsi += `<option value="${id}">${id}. ${escHtml(item.nama)} - ${rupiah(item.harga)}</option>`;
    }

    const html = `
    <h2>➕ Tambah Pesanan</h2>
    <div class="form-group">
        <label for="pilih-menu">Pilih Menu</label>
        <select id="pilih-menu">${opsi}</select>
    </div>
    <div class="form-group">
        <label for="input-jumlah">Jumlah Pesanan</label>
        <input type="number" id="input-jumlah" min="1" value="1">
    </div>
    <button class="btn" onclick="prosesTambahPesanan()">Tambah ke Keranjang</button>
    `;
    document.getElementById("konten").innerHTML = html;
}

function prosesTambahPesanan() {
    const idMenu = parseInt(document.getElementById("pilih-menu").value);
    const jumlah = parseInt(document.getElementById("input-jumlah").value);

    if (!menu[idMenu]) { notif("Menu tidak ditemukan!", "error"); return; }
    if (!jumlah || jumlah <= 0) { notif("Jumlah harus lebih dari 0!", "error"); return; }

    const existing = keranjang.find(it => it.id === idMenu);
    if (existing) {
        existing.jumlah += jumlah;
        notif(`${menu[idMenu].nama} berhasil ditambah. Total: ${existing.jumlah} porsi`, "success");
    } else {
        keranjang.push({
            id: idMenu,
            nama: menu[idMenu].nama,
            harga: menu[idMenu].harga,
            jumlah: jumlah
        });
        notif(`${menu[idMenu].nama} x${jumlah} ditambahkan ke keranjang.`, "success");
    }
    tampilkanKeranjang();
}

/* =====================================================
   3. LIHAT KERANJANG
   ===================================================== */
function tampilkanKeranjang() {
    if (keranjang.length === 0) {
        document.getElementById("konten").innerHTML =
            `<h2>🛒 Keranjang</h2><div class="empty-msg">Keranjang masih kosong.</div>`;
        return;
    }

    let html = `<h2>🛒 Isi Keranjang</h2>
    <table>
        <thead>
            <tr>
                <th class="center">No</th>
                <th>Nama Menu</th>
                <th class="num">Harga</th>
                <th class="center">Jml</th>
                <th class="num">Subtotal</th>
            </tr>
        </thead>
        <tbody>`;
    let total = 0;
    keranjang.forEach((item, idx) => {
        const subtotal = item.harga * item.jumlah;
        total += subtotal;
        html += `<tr>
            <td class="center">${idx + 1}</td>
            <td>${escHtml(item.nama)}</td>
            <td class="num">${rupiah(item.harga)}</td>
            <td class="center">${item.jumlah}</td>
            <td class="num">${rupiah(subtotal)}</td>
        </tr>`;
    });
    html += `<tr class="total-row">
        <td colspan="4">TOTAL</td>
        <td class="num">${rupiah(total)}</td>
    </tr></tbody></table>`;

    if (total >= 50000) {
        html += `<div class="diskon-box">🎉 Total belanja Anda memenuhi syarat diskon 10% (hanya info, tidak mengurangi total bayar).</div>`;
    }

    document.getElementById("konten").innerHTML = html;
}

/* =====================================================
   4. UBAH JUMLAH PESANAN
   ===================================================== */
function tampilkanUbahJumlah() {
    if (keranjang.length === 0) {
        document.getElementById("konten").innerHTML =
            `<h2>✏️ Ubah Jumlah</h2><div class="empty-msg">Keranjang masih kosong.</div>`;
        return;
    }

    let html = `<h2>✏️ Ubah Jumlah Pesanan</h2>
    <table>
        <thead>
            <tr>
                <th class="center">No</th>
                <th>Nama Menu</th>
                <th class="num">Harga</th>
                <th class="center">Jumlah Baru</th>
                <th class="center">Aksi</th>
            </tr>
        </thead>
        <tbody>`;
    keranjang.forEach((item, idx) => {
        html += `<tr>
            <td class="center">${idx + 1}</td>
            <td>${escHtml(item.nama)}</td>
            <td class="num">${rupiah(item.harga)}</td>
            <td class="center"><input type="number" class="qty-input" id="qty-${idx}" min="1" value="${item.jumlah}"></td>
            <td class="center"><button class="btn btn-small btn-success" onclick="simpanUbahJumlah(${idx})">Simpan</button></td>
        </tr>`;
    });
    html += `</tbody></table>`;
    document.getElementById("konten").innerHTML = html;
}

function simpanUbahJumlah(idx) {
    const jumlahBaru = parseInt(document.getElementById(`qty-${idx}`).value);
    if (!jumlahBaru || jumlahBaru <= 0) {
        notif("Jumlah harus lebih dari 0!", "error");
        return;
    }
    keranjang[idx].jumlah = jumlahBaru;
    notif(`Jumlah ${keranjang[idx].nama} diubah menjadi ${jumlahBaru}.`, "success");
    tampilkanUbahJumlah();
}

/* =====================================================
   5. HAPUS ITEM DARI KERANJANG
   ===================================================== */
function tampilkanHapusItem() {
    if (keranjang.length === 0) {
        document.getElementById("konten").innerHTML =
            `<h2>🗑️ Hapus Item</h2><div class="empty-msg">Keranjang masih kosong.</div>`;
        return;
    }

    let html = `<h2>🗑️ Hapus Menu dari Keranjang</h2>
    <table>
        <thead>
            <tr>
                <th class="center">No</th>
                <th>Nama Menu</th>
                <th class="center">Jumlah</th>
                <th class="num">Subtotal</th>
                <th class="center">Aksi</th>
            </tr>
        </thead>
        <tbody>`;
    keranjang.forEach((item, idx) => {
        html += `<tr>
            <td class="center">${idx + 1}</td>
            <td>${escHtml(item.nama)}</td>
            <td class="center">${item.jumlah}</td>
            <td class="num">${rupiah(item.harga * item.jumlah)}</td>
            <td class="center"><button class="btn btn-small btn-danger" onclick="hapusItem(${idx})">Hapus</button></td>
        </tr>`;
    });
    html += `</tbody></table>`;
    document.getElementById("konten").innerHTML = html;
}

function hapusItem(idx) {
    const nama = keranjang[idx].nama;
    keranjang.splice(idx, 1);
    notif(`${nama} berhasil dihapus dari keranjang.`, "success");
    tampilkanHapusItem();
}

/* =====================================================
   6. CHECKOUT & BAYAR  (dengan metode QRIS / Tunai)
   ===================================================== */
function tampilkanCheckout() {
    if (keranjang.length === 0) {
        document.getElementById("konten").innerHTML =
            `<h2>💰 Checkout</h2><div class="empty-msg">Keranjang masih kosong, tidak bisa checkout.</div>`;
        return;
    }

    totalCheckout = 0;
    keranjang.forEach(it => totalCheckout += it.harga * it.jumlah);
    metodePembayaran = null;   // reset pilihan

    let detailHtml = "";
    keranjang.forEach(it => {
        detailHtml += `<div class="struk-line">
            <span>${escHtml(it.nama)} x${it.jumlah}</span>
            <span>${rupiah(it.harga * it.jumlah)}</span>
        </div>`;
    });

    let diskonHtml = "";
    if (totalCheckout >= 50000) {
        const diskonInfo = Math.floor(totalCheckout * 0.1);
        diskonHtml = `<div class="diskon-box">
            🎉 Info: Anda berhak mendapat diskon 10% = ${rupiah(diskonInfo)}<br>
            <em>(Diskon hanya informasi, total bayar tetap sesuai total belanja)</em>
        </div>`;
    }

    const html = `
    <h2>💰 Checkout & Bayar</h2>
    <div class="struk">
        <h3>Rincian Pesanan</h3>
        ${detailHtml}
        <div class="struk-line bold highlight">
            <span>TOTAL BAYAR</span>
            <span>${rupiah(totalCheckout)}</span>
        </div>
    </div>
    ${diskonHtml}

    <div class="pembayaran-section">
        <h3 style="color:#8b4513;margin-bottom:4px;">Pilih Metode Pembayaran</h3>
        <p style="font-size:0.85rem;color:#888;margin-bottom:4px;">Silakan pilih salah satu:</p>

        <div class="metode-grid">
            <div class="metode-card" id="metode-qris" onclick="pilihMetode('qris')">
                <span class="icon">📱</span>
                <div class="label">QRIS</div>
                <div class="sub">Scan QR dengan e-wallet / m-banking</div>
            </div>
            <div class="metode-card" id="metode-tunai" onclick="pilihMetode('tunai')">
                <span class="icon">💵</span>
                <div class="label">Tunai</div>
                <div class="sub">Bayar langsung di kasir</div>
            </div>
        </div>

        <div id="area-pembayaran"></div>
    </div>
    `;
    document.getElementById("konten").innerHTML = html;
}

function pilihMetode(metode) {
    metodePembayaran = metode;

    // highlight kartu
    document.getElementById("metode-qris").classList.toggle("active", metode === "qris");
    document.getElementById("metode-tunai").classList.toggle("active", metode === "tunai");

    const area = document.getElementById("area-pembayaran");

    if (metode === "qris") {
        area.innerHTML = `
            <div class="qris-box">
                <div class="qris-label">📱 Pembayaran QRIS</div>
                <div class="qris-sub">Scan QR di bawah menggunakan aplikasi e-wallet / m-banking Anda</div>
                <div class="qr-frame">
                    <canvas id="canvas-qr" width="200" height="200"></canvas>
                </div>
                <div class="qris-amount">${rupiah(totalCheckout)}</div>
                <div class="qris-note">*QR simulasi untuk demo. Setelah scan, klik tombol di bawah.</div>
            </div>
            <button class="btn btn-success btn-block" onclick="prosesCheckoutQRIS()">
                ✅ Saya Sudah Bayar via QRIS
            </button>
        `;
        // gambar QR setelah elemen ada di DOM
        const canvas = document.getElementById("canvas-qr");
        gambarQRCode(canvas, namaPelanggan + "-" + nomorMeja + "-" + totalCheckout + "-" + Date.now());

    } else if (metode === "tunai") {
        area.innerHTML = `
            <div class="form-group" style="margin-top:12px;">
                <label for="input-uang">Masukkan Uang Pembayaran (Rp)</label>
                <input type="number" id="input-uang" min="0" placeholder="Contoh: 100000">
            </div>
            <button class="btn btn-success btn-block" onclick="prosesCheckoutTunai()">
                💵 Bayar Tunai
            </button>
        `;
        document.getElementById("input-uang").focus();
    }
}

/* Checkout QRIS: uang dianggap pas, kembalian 0 */
function prosesCheckoutQRIS() {
    if (!metodePembayaran) {
        notif("Pilih metode pembayaran dulu!", "error");
        return;
    }

    const total = totalCheckout;
    const diskonInfo = total >= 50000 ? Math.floor(total * 0.1) : 0;
    const uangBayar = total;      // QRIS = bayar pas
    const kembalian = 0;

    simpanRiwayat(total, diskonInfo, uangBayar, kembalian, "QRIS");
    tampilkanStruk(total, diskonInfo, uangBayar, kembalian, "QRIS");
    keranjang = [];
    notif("Pembayaran QRIS berhasil!", "success");
}

/* Checkout Tunai: ada uang bayar + kembalian */
function prosesCheckoutTunai() {
    const total = totalCheckout;
    const uang = parseInt(document.getElementById("input-uang").value);

    if (isNaN(uang) || uang <= 0) {
        notif("Masukkan uang pembayaran yang valid!", "error");
        return;
    }
    if (uang < total) {
        notif(`Uang kurang! Anda masih kurang ${rupiah(total - uang)}`, "error");
        return;
    }

    const kembalian = uang - total;
    const diskonInfo = total >= 50000 ? Math.floor(total * 0.1) : 0;

    simpanRiwayat(total, diskonInfo, uang, kembalian, "Tunai");
    tampilkanStruk(total, diskonInfo, uang, kembalian, "Tunai");
    keranjang = [];
    notif("Pembayaran tunai berhasil!", "success");
}

function simpanRiwayat(total, diskonInfo, uangBayar, kembalian, metode) {
    riwayatPesanan.push({
        namaPelanggan: namaPelanggan,
        nomorMeja: nomorMeja,
        pesanan: keranjang.map(it => ({ ...it })),
        total: total,
        diskonInfo: diskonInfo,
        totalBayar: total,
        uangBayar: uangBayar,
        kembalian: kembalian,
        metode: metode
    });
}

function tampilkanStruk(total, diskonInfo, uangBayar, kembalian, metode) {
    // Karena keranjang sudah / akan dikosongkan, ambil dari riwayat terakhir
    const data = riwayatPesanan[riwayatPesanan.length - 1];

    let detailHtml = "";
    data.pesanan.forEach(it => {
        detailHtml += `<div class="struk-line">
            <span>${escHtml(it.nama)} x${it.jumlah}</span>
            <span>${rupiah(it.harga * it.jumlah)}</span>
        </div>`;
    });

    let diskonHtml = "";
    if (diskonInfo > 0) {
        diskonHtml = `<div class="struk-line">
            <span>Info Diskon 10%</span>
            <span>${rupiah(diskonInfo)}</span>
        </div>`;
    }

    let pembayaranHtml = "";
    if (metode === "QRIS") {
        pembayaranHtml = `
            <div class="struk-line"><span>Metode</span><span>📱 QRIS</span></div>
            <div class="struk-line"><span>Dibayar (QRIS)</span><span>${rupiah(uangBayar)}</span></div>
            <div class="struk-line bold highlight"><span>Kembalian</span><span>Rp 0 (bayar pas)</span></div>
        `;
    } else {
        pembayaranHtml = `
            <div class="struk-line"><span>Metode</span><span>💵 Tunai</span></div>
            <div class="struk-line"><span>Uang Bayar</span><span>${rupiah(uangBayar)}</span></div>
            <div class="struk-line bold highlight"><span>Kembalian</span><span>${rupiah(kembalian)}</span></div>
        `;
    }

    const strukHtml = `
    <h2>✅ Pembayaran Berhasil</h2>
    <div class="struk">
        <h3>STRUK PEMBAYARAN</h3>
        <div class="struk-line"><span>Pelanggan</span><span>${escHtml(data.namaPelanggan)}</span></div>
        <div class="struk-line"><span>Nomor Meja</span><span>${escHtml(data.nomorMeja)}</span></div>
        <div style="border-top:1px dashed #999;margin:8px 0;"></div>
        ${detailHtml}
        ${diskonHtml}
        <div class="struk-line bold"><span>Total Belanja</span><span>${rupiah(total)}</span></div>
        <div class="struk-line bold highlight"><span>TOTAL BAYAR</span><span>${rupiah(total)}</span></div>
        ${pembayaranHtml}
    </div>
    <p style="text-align:center;margin-top:16px;color:#28a745;font-weight:600;">
        🧾 Terima kasih! Pesanan Anda sedang diproses.
    </p>
    <div style="text-align:center;margin-top:12px;">
        <button class="btn" onclick="tampilkanMenu()">Pesan Lagi</button>
    </div>
    `;

    document.getElementById("konten").innerHTML = strukHtml;
}

/* =====================================================
   7. LIHAT RIWAYAT PESANAN
   ===================================================== */
function tampilkanRiwayat() {
    if (riwayatPesanan.length === 0) {
        document.getElementById("konten").innerHTML =
            `<h2>📜 Riwayat Pesanan</h2><div class="empty-msg">Belum ada riwayat pesanan.</div>`;
        return;
    }

    let html = `<h2>📜 Riwayat Pesanan</h2>`;
    riwayatPesanan.forEach((p, i) => {
        let detail = "";
        p.pesanan.forEach(it => {
            detail += `• ${escHtml(it.nama)} x${it.jumlah} = ${rupiah(it.harga * it.jumlah)}<br>`;
        });

        let diskonStr = p.diskonInfo > 0
            ? `<strong>Info Diskon:</strong> ${rupiah(p.diskonInfo)} (tidak mengurangi total)<br>`
            : "";

        const metodeStr = p.metode === "QRIS"
            ? `📱 QRIS (bayar pas)`
            : `💵 Tunai`;

        const bayarStr = p.metode === "QRIS"
            ? `<strong>Dibayar QRIS:</strong> ${rupiah(p.uangBayar)}<br>
               <strong>Kembalian:</strong> Rp 0 (bayar pas)<br>`
            : `<strong>Uang Bayar:</strong> ${rupiah(p.uangBayar)}<br>
               <strong>Kembalian:</strong> ${rupiah(p.kembalian)}<br>`;

        html += `
        <div class="riwayat-card">
            <h3>Pesanan #${i + 1}</h3>
            <div class="detail">
                <strong>Pelanggan:</strong> ${escHtml(p.namaPelanggan)}<br>
                <strong>Nomor Meja:</strong> ${escHtml(p.nomorMeja)}<br>
                <strong>Metode:</strong> ${metodeStr}<br>
                <strong>Detail Pesanan:</strong><br>
                ${detail}
                <strong>Total:</strong> ${rupiah(p.total)}<br>
                ${diskonStr}
                <strong>Total Bayar:</strong> ${rupiah(p.totalBayar)}<br>
                ${bayarStr}
            </div>
        </div>`;
    });
    document.getElementById("konten").innerHTML = html;
}

/* =====================================================
   0. KELUAR
   ===================================================== */
function keluar() {
    if (confirm(`Terima kasih ${namaPelanggan}, yakin ingin keluar?`)) {
        keranjang = [];
        riwayatPesanan = [];
        namaPelanggan = "";
        nomorMeja = "";
        metodePembayaran = null;
        totalCheckout = 0;
        document.getElementById("input-nama").value = "";
        document.getElementById("input-meja").value = "";
        document.getElementById("identitas-section").style.display = "block";
        document.getElementById("app-section").style.display = "none";
        document.getElementById("konten").innerHTML = "";
        notif("Sampai jumpa lagi! 👋", "info");
    }
}
</script>
